# Agentic Business OS scheduler config

timezone: UTC

tasks:
  - name: repo-health
    skill: repo-health
    log_dir: repo-health
    schedule: weekly_MON_08:00
    runner: command
    model: local
    mode: async
    notify: false
    notify_policy: on_problem
    remind_until_reviewed: false
    enabled: false
    command: >-
      python3 system/tools/repo_audit.py
      --output system/health/repo-audit.md
      --brief-output {{LOG_FILE}}
      --task-name repo-health
      --state-db system/state/ops.db
      --exit-zero

  - name: learning-review
    skill: learning-review
    log_dir: learning
    schedule: weekly_FRI_15:00
    runner: command
    model: local
    mode: async
    notify: false
    notify_policy: on_problem
    remind_until_reviewed: false
    enabled: false
    command: >-
      python3 system/tools/learning_review.py review
      --days 7
      --brief-output {{LOG_FILE}}
